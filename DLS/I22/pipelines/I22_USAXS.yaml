name: I22 USAXS correction pipeline
description: >-
  Dark-adjusted I22 Bonse--Hart USAXS processing. The sample source is one
  preprocessed four-scan acquisition and the background source is scans
  977724--977727. Diode and I0 readouts are normalized to their exposure
  times explicitly. Transmission uses the full scan; the final scattering
  curve uses the negative analyser wing. The high-gain front saturation
  threshold is provisional and must be reviewed for new acquisitions.
steps:
  PD_SLF:
    module: AppendProcessingData
    short_title: "Load SLF diode"
    requires_steps: []
    configuration:
      processing_key: "SLF"
      databundle_output_key: "signal"
      signal_location: "sample::/entry1/low_gain_front/signal"
      units_location: "sample::/entry1/low_gain_front/signal@units"
      rank_of_data: 1
      uncertainties_sources:
        subread_sem: "sample::/entry1/low_gain_front/subread_sem"
        dark_offset_sem: "sample::/entry1/low_gain_front/dark_offset_sem"
  PD_SLF_yaw:
    module: AppendProcessingData
    short_title: "Load SLF yaw"
    requires_steps: ["PD_SLF"]
    configuration:
      processing_key: "SLF"
      databundle_output_key: "yaw"
      signal_location: "sample::/entry1/low_gain_front/yaw"
      units_location: "sample::/entry1/low_gain_front/yaw@units"
      rank_of_data: 1
  PD_SLF_energy:
    module: AppendProcessingData
    short_title: "Load SLF energy"
    requires_steps: ["PD_SLF_yaw"]
    configuration:
      processing_key: "SLF"
      databundle_output_key: "energy"
      signal_location: "sample::/entry1/low_gain_front/energy"
      units_location: "sample::/entry1/low_gain_front/energy@units"
      rank_of_data: 0
  MK_SLF:
    module: ThresholdMask
    short_title: "Dynamic range mask SLF"
    requires_steps: ["PD_SLF_energy"]
    configuration:
      with_processing_keys: ["SLF"]
      source_basedata_key: "signal"
      target_mask_key: "Mask"
      lower_bound: 0
      mask_mode: "outside"
  TI_SLF:
    module: Divide
    short_title: "Normalize SLF diode to exposure time"
    requires_steps: ["MK_SLF"]
    configuration:
      with_processing_keys: ["SLF"]
      divisor_source: "sample::/entry1/low_gain_front/count_time"
      divisor_units_source: "sample::/entry1/low_gain_front/count_time@units"
  PD_SLR:
    module: AppendProcessingData
    short_title: "Load SLR diode"
    requires_steps: []
    configuration:
      processing_key: "SLR"
      databundle_output_key: "signal"
      signal_location: "sample::/entry1/low_gain_rear/signal"
      units_location: "sample::/entry1/low_gain_rear/signal@units"
