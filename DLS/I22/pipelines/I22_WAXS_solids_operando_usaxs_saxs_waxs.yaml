name: I22 WAXS solids operando - USAXS/SAXS/WAXS nosecone
description: >-
  I22 WAXS correction and glassy-carbon absolute-intensity calibration pipeline
  for the combined USAXS/SAXS/WAXS beamline
  configuration. This special nosecone has no aluminium attenuator. The raw
  detector frames remain externally linked from compact notebook-preprocessed
  measurement files; the preprocessor only reshapes or summarizes frame-wise
  metadata. Detector geometry is resolved by MoDaCor directly from the NeXus calibration files. After
  count-time normalization, the signal is divided by the calibrated sample
  transmission and the incident I0 flux; both readouts are non-integrating.
  Measurement 966700 follows the same correction path, is normalized by its
  known 1.0 mm thickness, and is fitted to the Glassy Carbon L reference curve.
steps:
  PD_sample:
    module: AppendProcessingData
    short_title: Load WAXS sample
    requires_steps: []
    configuration:
      processing_key: sample
      databundle_output_key: signal
      signal_location: sample::/entry1/Pilatus2M_WAXS/data
      units_override: count
      rank_of_data: 2

  PD_background:
    module: AppendProcessingData
    short_title: Load WAXS background
    requires_steps: []
    configuration:
      processing_key: background
      databundle_output_key: signal
      signal_location: background::/entry1/Pilatus2M_WAXS/data
      units_override: count
      rank_of_data: 2

  PD_intensity_calibration:
    module: AppendProcessingData
    short_title: Load WAXS glassy-carbon measurement
    requires_steps: []
    configuration:
      processing_key: intensity_calibration
      databundle_output_key: signal
      signal_location: intensity_calibration::/entry1/Pilatus2M_WAXS/data
      units_override: count
      rank_of_data: 2

  PD_intensity_calibration_reference_I:
    module: AppendProcessingData
    short_title: Load glassy-carbon reference intensity
    requires_steps: []
    configuration:
      processing_key: intensity_calibration_reference
      databundle_output_key: signal
      signal_location: intensity_calibration_reference::I
      units_override: 1/(cm*sr)
      uncertainties_sources:
        combined: intensity_calibration_reference::I_sigma
      rank_of_data: 1

  PD_intensity_calibration_reference_Q:
    module: AppendProcessingData
    short_title: Load glassy-carbon reference Q
    requires_steps: [PD_intensity_calibration_reference_I]
    configuration:
      processing_key: intensity_calibration_reference
      databundle_output_key: Q
      signal_location: intensity_calibration_reference::Q
      units_override: 1/angstrom
      rank_of_data: 1

  PD_static_signal:
    module: AppendProcessingData
    short_title: Load WAXS calibration shape
    requires_steps: []
    configuration:
      processing_key: static
      databundle_output_key: signal
      signal_location: waxs_calibration::/entry1/calibration_data/data
      units_override: count
      rank_of_data: 2

  PD_static_mask:
    module: AppendProcessingData
    short_title: Load WAXS mask
    requires_steps: []
    configuration:
      processing_key: static
      databundle_output_key: mask
      signal_location: waxs_mask::/entry/mask/mask
      units_override: dimensionless
      rank_of_data: 2

  PU_sample:
    module: PoissonUncertainties
    short_title: WAXS Poisson uncertainties
    requires_steps: [MK_raw_sample]
    configuration:
      with_processing_keys: [sample]

  MK_raw_sample:
    module: ThresholdMask
    short_title: Raw-count validity mask
    requires_steps: [PD_sample]
    configuration:
      with_processing_keys: [sample]
      source_basedata_key: signal
      target_mask_key: raw_count_mask
      lower_bound: 0.0
      upper_bound: 10000000.0
      mask_mode: outside

  TI_sample:
    module: Divide
    short_title: WAXS count-time normalization
    requires_steps: [PU_sample]
    configuration:
      divisor_source: sample::/modacor/normalization/waxs_count_time
      divisor_units_source: sample::/modacor/normalization/waxs_count_time@units
      with_processing_keys: [sample]

  TR_sample:
    module: Divide
    short_title: Sample transmission normalization
    requires_steps: [TI_sample]
    configuration:
      divisor_source: sample::/entry1/sample/transmission
      divisor_units_source: sample::/entry1/sample/transmission@units
      divisor_uncertainties_sources:
        transmission_SEM: sample::/entry1/sample/transmission_sem
      with_processing_keys: [sample]

  FL_sample:
    module: Divide
    short_title: Incident I0 flux normalization
    requires_steps: [TR_sample]
    configuration:
      divisor_source: sample::/modacor/normalization/i0_channel_1_mean
      divisor_units_source: sample::/modacor/normalization/i0_channel_1_mean@units
      divisor_uncertainties_sources:
        I0_SEM: sample::/modacor/normalization/i0_channel_1_sem
      with_processing_keys: [sample]

  FA_sample:
    module: ReduceDimensionality
    short_title: Average WAXS frames
    requires_steps: [FL_sample]
    configuration:
      axes: [0, 1]
      use_weights: true
      nan_policy: propagate
      reduction: mean
      with_processing_keys: [sample]

  MK_raw_sample_reduce:
    module: ReduceMask
    short_title: Collapse raw-count mask
    requires_steps: [FA_sample]
    configuration:
      with_processing_keys: [sample]
      source_mask_key: raw_count_mask
      target_mask_key: raw_count_mask
      axes: [0, 1]
      reduction: any

  PU_intensity_calibration:
    module: PoissonUncertainties
    short_title: Glassy-carbon Poisson uncertainties
    requires_steps: [MK_raw_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration]

  MK_raw_intensity_calibration:
    module: ThresholdMask
    short_title: Glassy-carbon raw-count validity mask
    requires_steps: [PD_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration]
      source_basedata_key: signal
      target_mask_key: raw_count_mask
      lower_bound: 0.0
      upper_bound: 10000000.0
      mask_mode: outside

  TI_intensity_calibration:
    module: Divide
    short_title: Glassy-carbon count-time normalization
    requires_steps: [PU_intensity_calibration]
    configuration:
      divisor_source: intensity_calibration::/modacor/normalization/waxs_count_time
      divisor_units_source: intensity_calibration::/modacor/normalization/waxs_count_time@units
      with_processing_keys: [intensity_calibration]

  TR_intensity_calibration:
    module: Divide
    short_title: Glassy-carbon transmission normalization
    requires_steps: [TI_intensity_calibration]
    configuration:
      divisor_source: intensity_calibration::/entry1/sample/transmission
      divisor_units_source: intensity_calibration::/entry1/sample/transmission@units
      divisor_uncertainties_sources:
        transmission_SEM: intensity_calibration::/entry1/sample/transmission_sem
      with_processing_keys: [intensity_calibration]

  FL_intensity_calibration:
    module: Divide
    short_title: Glassy-carbon incident I0 flux normalization
    requires_steps: [TR_intensity_calibration]
    configuration:
      divisor_source: intensity_calibration::/modacor/normalization/i0_channel_1_mean
      divisor_units_source: intensity_calibration::/modacor/normalization/i0_channel_1_mean@units
      divisor_uncertainties_sources:
        I0_SEM: intensity_calibration::/modacor/normalization/i0_channel_1_sem
      with_processing_keys: [intensity_calibration]

  FA_intensity_calibration:
    module: ReduceDimensionality
    short_title: Average glassy-carbon frames
    requires_steps: [FL_intensity_calibration]
    configuration:
      axes: [0, 1]
      use_weights: true
      nan_policy: propagate
      reduction: mean
      with_processing_keys: [intensity_calibration]

  MK_raw_intensity_calibration_reduce:
    module: ReduceMask
    short_title: Collapse glassy-carbon raw-count mask
    requires_steps: [FA_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration]
      source_mask_key: raw_count_mask
      target_mask_key: raw_count_mask
      axes: [0, 1]
      reduction: any

  PU_background:
    module: PoissonUncertainties
    short_title: Background Poisson uncertainties
    requires_steps: [MK_raw_background]
    configuration:
      with_processing_keys: [background]

  MK_raw_background:
    module: ThresholdMask
    short_title: Background raw-count mask
    requires_steps: [PD_background]
    configuration:
      with_processing_keys: [background]
      source_basedata_key: signal
      target_mask_key: raw_count_mask
      lower_bound: 0.0
      upper_bound: 10000000.0
      mask_mode: outside

  TI_background:
    module: Divide
    short_title: Background count-time normalization
    requires_steps: [PU_background]
    configuration:
      divisor_source: background::/modacor/normalization/waxs_count_time
      divisor_units_source: background::/modacor/normalization/waxs_count_time@units
      with_processing_keys: [background]

  TR_background:
    module: Divide
    short_title: Background transmission normalization
    requires_steps: [TI_background]
    configuration:
      divisor_source: background::/entry1/sample/transmission
      divisor_units_source: background::/entry1/sample/transmission@units
      divisor_uncertainties_sources:
        transmission_SEM: background::/entry1/sample/transmission_sem
      with_processing_keys: [background]

  FL_background:
    module: Divide
    short_title: Background incident I0 flux normalization
    requires_steps: [TR_background]
    configuration:
      divisor_source: background::/modacor/normalization/i0_channel_1_mean
      divisor_units_source: background::/modacor/normalization/i0_channel_1_mean@units
      divisor_uncertainties_sources:
        I0_SEM: background::/modacor/normalization/i0_channel_1_sem
      with_processing_keys: [background]

  FA_background:
    module: ReduceDimensionality
    short_title: Average background frames
    requires_steps: [FL_background]
    configuration:
      axes: [0, 1]
      use_weights: true
      nan_policy: propagate
      reduction: mean
      with_processing_keys: [background]

  MK_raw_background_reduce:
    module: ReduceMask
    short_title: Collapse background mask
    requires_steps: [FA_background]
    configuration:
      with_processing_keys: [background]
      source_mask_key: raw_count_mask
      target_mask_key: raw_count_mask
      axes: [0, 1]
      reduction: any

  BG:
    module: SubtractDatabundles
    short_title: Subtract corrected background
    requires_steps: [MK_raw_sample_reduce, MK_raw_background_reduce]
    configuration:
      with_processing_keys: [sample, background]

  BG_intensity_calibration:
    module: SubtractDatabundles
    short_title: Subtract glassy-carbon background
    requires_steps: [MK_raw_intensity_calibration_reduce, MK_raw_background_reduce]
    configuration:
      with_processing_keys: [intensity_calibration, background]

  PC_static:
    module: PixelCoordinates3D
    short_title: WAXS pixel coordinates
    requires_steps: [PD_static_signal]
    configuration:
      with_processing_keys: [static]
      detector_frame:
        type: nexus
        source: waxs_calibration
        detector_path: /entry1/instrument/detector
        module_origin: first_pixel_center

  GX_static:
    module: XSGeometryFromPixelCoordinates
    short_title: WAXS scattering geometry
    requires_steps: [PC_static]
    configuration:
      with_processing_keys: [static]
      detector_frame:
        type: nexus
        source: waxs_calibration
        detector_path: /entry1/instrument/detector
        module_origin: first_pixel_center
      sample_z_override:
        value: 0.0
        units: mm
      photon_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength
      photon_units_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength@units

  IP_static:
    module: IndexByCoordinate
    short_title: Index WAXS pixels
    requires_steps: [GX_static]
    configuration:
      coordinate_key: Q
      bin_min: 4.4241476418082226
      bin_max: 54.71698841709772
      bin_units: 1/nm
      spacing: linear
      n_bins: 1502
      with_processing_keys: [static]

  CP_static_sample_maps:
    module: CopyDataBundleKeys
    short_title: Attach WAXS static maps
    requires_steps: [BG, IP_static, PD_static_mask]
    configuration:
      with_processing_keys: [sample, static]
      data_keys: [mask, Q, Psi, TwoTheta, CosAlpha, Omega, bin_index]
      copy: false

  CP_static_intensity_calibration_maps:
    module: CopyDataBundleKeys
    short_title: Attach WAXS static maps to glassy carbon
    requires_steps: [BG_intensity_calibration, IP_static, PD_static_mask]
    configuration:
      with_processing_keys: [intensity_calibration, static]
      data_keys: [mask, Q, Psi, TwoTheta, CosAlpha, Omega, bin_index]
      copy: false

  MK_instrument_dilate:
    module: DilateMask
    short_title: Dilate WAXS mask
    requires_steps: [CP_static_sample_maps]
    configuration:
      with_processing_keys: [sample]
      source_mask_key: mask
      target_mask_key: mask
      radius: 1
      footprint_shape: square

  MK_instrument_dilate_intensity_calibration:
    module: DilateMask
    short_title: Dilate glassy-carbon WAXS mask
    requires_steps: [CP_static_intensity_calibration_maps]
    configuration:
      with_processing_keys: [intensity_calibration]
      source_mask_key: mask
      target_mask_key: mask
      radius: 1
      footprint_shape: square

  CP_background_raw_mask:
    module: CopyDataBundleKeys
    short_title: Attach background raw mask
    requires_steps: [BG]
    configuration:
      with_processing_keys: [sample, background]
      key_map:
        raw_count_mask: background_raw_count_mask
      copy: false

  CP_background_raw_mask_intensity_calibration:
    module: CopyDataBundleKeys
    short_title: Attach background raw mask to glassy carbon
    requires_steps: [BG_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration, background]
      key_map:
        raw_count_mask: background_raw_count_mask
      copy: false

  MK_combined:
    module: BitwiseOrMasks
    short_title: Combine detector masks
    requires_steps: [MK_instrument_dilate, CP_background_raw_mask]
    configuration:
      with_processing_keys: [sample]
      target_mask_key: mask
      source_mask_keys: [raw_count_mask, background_raw_count_mask]

  MK_combined_intensity_calibration:
    module: BitwiseOrMasks
    short_title: Combine glassy-carbon detector masks
    requires_steps:
      [MK_instrument_dilate_intensity_calibration, CP_background_raw_mask_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration]
      target_mask_key: mask
      source_mask_keys: [raw_count_mask, background_raw_count_mask]

  SP:
    module: SolidAngleCorrection
    short_title: WAXS solid-angle correction
    requires_steps: [MK_combined]
    configuration:
      with_processing_keys: [sample]

  SP_intensity_calibration:
    module: SolidAngleCorrection
    short_title: Glassy-carbon WAXS solid-angle correction
    requires_steps: [MK_combined_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration]

  DE:
    module: DetectorEfficiencyCorrection
    short_title: WAXS detector efficiency correction
    requires_steps: [SP]
    configuration:
      with_processing_keys: [sample]
      material: Si
      density: 2.33
      density_units: g/cm^3
      thickness: 0.32
      thickness_units: mm
      wavelength_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength
      wavelength_units_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength@units
      normalize_to_normal_incidence: true

  DE_intensity_calibration:
    module: DetectorEfficiencyCorrection
    short_title: Glassy-carbon WAXS detector efficiency correction
    requires_steps: [SP_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration]
      material: Si
      density: 2.33
      density_units: g/cm^3
      thickness: 0.32
      thickness_units: mm
      wavelength_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength
      wavelength_units_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength@units
      normalize_to_normal_incidence: true

  # The 1 mm aluminium attenuator used by the standard SAXS/WAXS nosecone was
  # confirmed absent from this USAXS/SAXS/WAXS configuration. Keep the
  # operation below as a documented reference, but do not enable it here.
  # AL:
  #   module: AttenuatorPlateCorrection
  #   short_title: WAXS aluminium attenuator correction
  #   requires_steps: [DE]
  #   configuration:
  #     with_processing_keys: [sample]
  #     material: Al
  #     density: 2.699
  #     density_units: g/cm^3
  #     thickness: 0.1
  #     thickness_units: cm
  #     wavelength_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength
  #     wavelength_units_source: waxs_calibration::/entry1/calibration_sample/beam/incident_wavelength@units
  #     normalize_to_normal_incidence: false
  #     apply_as: divide

  PO:
    module: PolarizationCorrection
    short_title: WAXS polarization correction
    requires_steps: [DE]
    configuration:
      with_processing_keys: [sample]
      mode: linear_fraction
      polarization_factor: 0.9
      polarization_angular_offset: 0.0
      polarization_angular_offset_units: degree

  PO_intensity_calibration:
    module: PolarizationCorrection
    short_title: Glassy-carbon WAXS polarization correction
    requires_steps: [DE_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration]
      mode: linear_fraction
      polarization_factor: 0.9
      polarization_angular_offset: 0.0
      polarization_angular_offset_units: degree

  TH_sample:
    module: Divide
    short_title: Normalize sample by its configured thickness
    requires_steps: [PO]
    configuration:
      divisor_source: sample::/entry1/sample/thickness
      divisor_units_source: sample::/entry1/sample/thickness@units
      with_processing_keys: [sample]

  TH_intensity_calibration:
    module: Divide
    short_title: Normalize glassy carbon by its 1.0 mm thickness
    requires_steps: [PO_intensity_calibration]
    configuration:
      divisor_source: intensity_calibration::/entry1/sample/thickness
      divisor_units_source: intensity_calibration::/entry1/sample/thickness@units
      with_processing_keys: [intensity_calibration]

  AV:
    module: IndexedAverager
    short_title: WAXS azimuthal integration
    requires_steps: [SV_2D, PL_2D]
    configuration:
      value_key: signal
      index_key: bin_index
      axis_key: Q
      mask_key: mask
      use_value_weights: true
      use_value_uncertainty_weights: false
      uncertainty_weight_key: null
      with_processing_keys: [sample]

  AV_intensity_calibration:
    module: IndexedAverager
    short_title: Glassy-carbon WAXS azimuthal integration
    requires_steps: [TH_intensity_calibration]
    configuration:
      value_key: signal
      index_key: bin_index
      axis_key: Q
      mask_key: mask
      use_value_weights: true
      use_value_uncertainty_weights: false
      uncertainty_weight_key: null
      with_processing_keys: [intensity_calibration]

  CU:
    module: CombineUncertaintiesMax
    short_title: Combine WAXS uncertainties
    requires_steps: [AV]
    configuration:
      with_processing_keys: [sample]
      target_basedata_key: signal
      combinations:
        combined: [Poisson, SEM]
      ignore_missing: true

  CU_intensity_calibration:
    module: CombineUncertaintiesMax
    short_title: Combine glassy-carbon WAXS uncertainties
    requires_steps: [AV_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration]
      target_basedata_key: signal
      combinations:
        combined: [Poisson, SEM]
      ignore_missing: true

  CP_intensity_calibration_fit:
    module: CopyDataBundleKeys
    short_title: Copy glassy-carbon curve for absolute-scale fitting
    requires_steps: [CU_intensity_calibration]
    configuration:
      with_processing_keys: [intensity_calibration_fit, intensity_calibration]
      data_keys: [signal, Q]
      copy: true

  SF:
    module: FindScaleFactor1D
    short_title: Fit WAXS glassy-carbon absolute scale
    requires_steps: [CP_intensity_calibration_fit, PD_intensity_calibration_reference_Q]
    configuration:
      with_processing_keys: [intensity_calibration_fit, intensity_calibration_reference]
      signal_key: signal
      independent_axis_key: Q
      scale_output_key: absolute_intensity_scale_factor
      scale_uncertainty_key: glassy_carbon_fit
      fit_background: false
      fit_model: lognormal
      uncertainty_weight_key: combined
      fit_min_val: 4.5
      fit_max_val: 11.7
      fit_val_units: 1/nm
      require_overlap: true
      interpolation_kind: linear
      robust_loss: huber
      robust_fscale: 1.0
      use_basedata_weights: true
      diagnostic_prefix: absolute_intensity_fit

  AU:
    module: MultiplyDatabundles
    short_title: Apply glassy-carbon absolute intensity scale
    requires_steps: [CU, SF]
    configuration:
      with_processing_keys: [sample, intensity_calibration_fit]
      multiplicand_data_key: signal
      multiplier_data_key: absolute_intensity_scale_factor

  PL_IQ:
    module: Plot1DVisualization
    short_title: Live WAXS I(Q) plot
    requires_steps: [AU]
    configuration:
      target: plots::waxs-1d
      x_path: /sample/Q/signal
      y_path: /sample/signal/signal
      x_units: 1/nm
      error_bar_thickness: 2.0
      error_bar_opacity: 0.65
      error_bar_width: 3
      xerr_uncertainty_names: [uncertainty_combined, SEM, STD]
      yerr_uncertainty_names: [combined, uncertainty_pixelvalues, SEM, STD, Poisson]
      title: WAXS corrected I(Q)

  SV_IQ:
    module: SinkProcessingData
    short_title: Save WAXS sample after I(Q) plot
    requires_steps: [AU]
    configuration:
      target: result_hdf::after_plot_iq
      data_paths:
        - /sample

  PL_2D:
    module: Plot2DVisualization
    short_title: Live WAXS corrected 2D image
    requires_steps: [TH_sample]
    configuration:
      target: plots::waxs-2d
      data_path: /sample/signal/signal
      title: WAXS corrected 2D detector image
      colormap: Viridis

  SV_2D:
    module: SinkProcessingData
    short_title: Save WAXS sample after 2D plot
    requires_steps: [TH_sample]
    configuration:
      target: result_hdf::after_plot_2d
      data_paths:
        - /sample
