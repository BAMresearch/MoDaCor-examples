name: saxsess_i_n008_absolute
# Recommended physical-correction pipeline for the liquid N008 reference set.
# It produces Q in 1/nm and absolute intensity in 1/(m sr). The supplied
# water-reference PDH is a legacy SAXSQuant calibration profile: 1.641 1/(m sr)
# with a stated 1% uncertainty. Its exact provenance remains a release gate and
# is documented in the adjacent README.

step_blocks:
  load_measurements:
    for_each:
      sample:
        processing_key: sample
        signal_location: sample::entry/instrument/detector/data
        units_location: sample::entry/instrument/detector/data@units
        title: Add sample measurement to processing data
      sample_background:
        processing_key: sample_background
        signal_location: sample_background::entry/instrument/detector/data
        units_location: sample_background::entry/instrument/detector/data@units
        title: Add sample background to processing data
      intensity_calibration:
        processing_key: intensity_calibration
        signal_location: intensity_calibration::entry/instrument/detector/data
        units_location: intensity_calibration::entry/instrument/detector/data@units
        title: Add intensity calibrant to processing data
      intensity_calibration_background:
        processing_key: intensity_calibration_background
        signal_location: intensity_calibration_background::entry/instrument/detector/data
        units_location: intensity_calibration_background::entry/instrument/detector/data@units
        title: Add calibrant background to processing data
    steps:
      raw:
        module: AppendProcessingData
        short_title: "${title}"
        requires_steps: []
        configuration:
          processing_key: "${processing_key}"
          rank_of_data: 2
          databundle_output_key: signal
          signal_location: "${signal_location}"
          units_location: "${units_location}"
          uncertainties_sources: {}

  normalize_measurements:
    # The directly measured transmitted foil rate is used as one divisor. This
    # is algebraically equivalent to root relative flux times overall
    # transmission, but does not double-count their shared root measurement.
    for_each:
      sample:
        processing_key: sample
        load_steps: [load_measurements.sample.raw]
        exposure_source: sample::entry/instrument/detector/frame_exposure_time
        exposure_uncertainty_source: sample::entry/instrument/detector/frame_exposure_time_uncertainty
        exposure_units_source: sample::entry/instrument/detector/frame_exposure_time@units
        transmitted_flux_source: sample::entry/sample/beam/transmitted_flux
        transmitted_flux_uncertainty_source: sample::entry/sample/beam/transmitted_flux_uncertainty
        transmitted_flux_units_source: sample::entry/sample/beam/transmitted_flux@units
      sample_background:
        processing_key: sample_background
        load_steps: [load_measurements.sample_background.raw]
        exposure_source: sample_background::entry/instrument/detector/frame_exposure_time
        exposure_uncertainty_source: sample_background::entry/instrument/detector/frame_exposure_time_uncertainty
        exposure_units_source: sample_background::entry/instrument/detector/frame_exposure_time@units
        transmitted_flux_source: sample_background::entry/sample/beam/transmitted_flux
        transmitted_flux_uncertainty_source: sample_background::entry/sample/beam/transmitted_flux_uncertainty
        transmitted_flux_units_source: sample_background::entry/sample/beam/transmitted_flux@units
      intensity_calibration:
        processing_key: intensity_calibration
        load_steps: [load_measurements.intensity_calibration.raw]
        exposure_source: intensity_calibration::entry/instrument/detector/frame_exposure_time
        exposure_uncertainty_source: intensity_calibration::entry/instrument/detector/frame_exposure_time_uncertainty
        exposure_units_source: intensity_calibration::entry/instrument/detector/frame_exposure_time@units
        transmitted_flux_source: intensity_calibration::entry/sample/beam/transmitted_flux
        transmitted_flux_uncertainty_source: intensity_calibration::entry/sample/beam/transmitted_flux_uncertainty
        transmitted_flux_units_source: intensity_calibration::entry/sample/beam/transmitted_flux@units
      intensity_calibration_background:
        processing_key: intensity_calibration_background
        load_steps: [load_measurements.intensity_calibration_background.raw]
        exposure_source: intensity_calibration_background::entry/instrument/detector/frame_exposure_time
        exposure_uncertainty_source: intensity_calibration_background::entry/instrument/detector/frame_exposure_time_uncertainty
        exposure_units_source: intensity_calibration_background::entry/instrument/detector/frame_exposure_time@units
        transmitted_flux_source: intensity_calibration_background::entry/sample/beam/transmitted_flux
        transmitted_flux_uncertainty_source: intensity_calibration_background::entry/sample/beam/transmitted_flux_uncertainty
        transmitted_flux_units_source: intensity_calibration_background::entry/sample/beam/transmitted_flux@units
    steps:
      poisson:
        module: PoissonUncertainties
        short_title: Calculate Poisson uncertainties
        requires_steps: "${load_steps}"
        configuration:
          with_processing_keys: ["${processing_key}"]
      exposure:
        module: Divide
        short_title: Normalize by frame exposure time
        requires_steps: [.poisson]
        configuration:
          divisor_source: "${exposure_source}"
          divisor_uncertainties_sources:
            propagate_to_all: "${exposure_uncertainty_source}"
          divisor_units_source: "${exposure_units_source}"
          with_processing_keys: ["${processing_key}"]
      dark_current:
        module: Subtract
        short_title: Subtract dark current
        requires_steps: [.exposure]
        configuration:
          subtrahend_source: defaults::detector/darkcurrent/value
          subtrahend_uncertainties_sources:
            propagate_to_all: defaults::detector/darkcurrent/uncertainty
          subtrahend_units_source: defaults::detector/darkcurrent/units
          with_processing_keys: ["${processing_key}"]
      transmitted_flux:
        module: Divide
        short_title: Normalize by directly measured transmitted flux
        requires_steps: [.dark_current]
        configuration:
          divisor_source: "${transmitted_flux_source}"
          divisor_uncertainties_sources:
            propagate_to_all: "${transmitted_flux_uncertainty_source}"
          divisor_units_source: "${transmitted_flux_units_source}"
          with_processing_keys: ["${processing_key}"]
      frame_average:
        module: ReduceDimensionality
        short_title: Average detector frames
        requires_steps: [.transmitted_flux]
        configuration:
          axes: 0
          use_weights: true
          nan_policy: propagate
          reduction: mean
          with_processing_keys: ["${processing_key}"]

  geometry:
    for_each:
      sample:
        processing_key: sample
        start_steps: [subtract_sample_background]
        det_z_source: sample::/entry/instrument/detector/transformations/det_z
        det_z_units_source: sample::/entry/instrument/detector/transformations/det_z@units
        det_z_uncertainty_source: sample::/entry/instrument/detector/transformations/det_z_uncertainty
        det_x_source: sample::/entry/instrument/detector/transformations/det_x
        det_x_units_source: sample::/entry/instrument/detector/transformations/det_x@units
        det_x_uncertainty_source: sample::/entry/instrument/detector/transformations/det_x_uncertainty
        det_y_source: sample::/entry/instrument/detector/transformations/det_y
        det_y_units_source: sample::/entry/instrument/detector/transformations/det_y@units
        det_y_uncertainty_source: sample::/entry/instrument/detector/transformations/det_y_uncertainty
        pixel_fast_source: sample::/entry/instrument/detector/x_pixel_size
        pixel_fast_units_source: sample::/entry/instrument/detector/x_pixel_size@units
        pixel_slow_source: sample::/entry/instrument/detector/y_pixel_size
        pixel_slow_units_source: sample::/entry/instrument/detector/y_pixel_size@units
        sample_z_source: sample::/entry/sample/transformations/sample_z
        sample_z_units_source: sample::/entry/sample/transformations/sample_z@units
        sample_z_uncertainty_source: sample::/entry/sample/transformations/sample_z_uncertainty
        photon_source: sample::/entry/sample/beam/incident_wavelength
        photon_units_source: sample::/entry/sample/beam/incident_wavelength@units
        photon_uncertainty_source: sample::/entry/sample/beam/incident_wavelength_uncertainty
        thickness_source: sample::entry/sample/thickness_averaged/mean
        thickness_units_source: sample::entry/sample/thickness_averaged/mean@units
        thickness_uncertainty_source: sample::entry/sample/thickness_averaged/mean_uncertainty
      intensity_calibration:
        processing_key: intensity_calibration
        start_steps: [subtract_calibrant_background]
        det_z_source: intensity_calibration::/entry/instrument/detector/transformations/det_z
        det_z_units_source: intensity_calibration::/entry/instrument/detector/transformations/det_z@units
        det_z_uncertainty_source: intensity_calibration::/entry/instrument/detector/transformations/det_z_uncertainty
        det_x_source: intensity_calibration::/entry/instrument/detector/transformations/det_x
        det_x_units_source: intensity_calibration::/entry/instrument/detector/transformations/det_x@units
        det_x_uncertainty_source: intensity_calibration::/entry/instrument/detector/transformations/det_x_uncertainty
        det_y_source: intensity_calibration::/entry/instrument/detector/transformations/det_y
        det_y_units_source: intensity_calibration::/entry/instrument/detector/transformations/det_y@units
        det_y_uncertainty_source: intensity_calibration::/entry/instrument/detector/transformations/det_y_uncertainty
        pixel_fast_source: intensity_calibration::/entry/instrument/detector/x_pixel_size
        pixel_fast_units_source: intensity_calibration::/entry/instrument/detector/x_pixel_size@units
        pixel_slow_source: intensity_calibration::/entry/instrument/detector/y_pixel_size
        pixel_slow_units_source: intensity_calibration::/entry/instrument/detector/y_pixel_size@units
        sample_z_source: intensity_calibration::/entry/sample/transformations/sample_z
        sample_z_units_source: intensity_calibration::/entry/sample/transformations/sample_z@units
        sample_z_uncertainty_source: intensity_calibration::/entry/sample/transformations/sample_z_uncertainty
        photon_source: intensity_calibration::/entry/sample/beam/incident_wavelength
        photon_units_source: intensity_calibration::/entry/sample/beam/incident_wavelength@units
        photon_uncertainty_source: intensity_calibration::/entry/sample/beam/incident_wavelength_uncertainty
        thickness_source: intensity_calibration::entry/sample/thickness_averaged/mean
        thickness_units_source: intensity_calibration::entry/sample/thickness_averaged/mean@units
        thickness_uncertainty_source: intensity_calibration::entry/sample/thickness_averaged/mean_uncertainty
    steps:
      pixel_coordinates:
        module: PixelCoordinates3D
        short_title: Calculate detector-strip coordinates
        requires_steps: "${start_steps}"
        configuration:
          with_processing_keys: ["${processing_key}"]
          det_coord_z_source: "${det_z_source}"
          det_coord_z_units_source: "${det_z_units_source}"
          det_coord_z_uncertainties_sources:
            propagate_to_all: "${det_z_uncertainty_source}"
          det_coord_x_source: "${det_x_source}"
          det_coord_x_units_source: "${det_x_units_source}"
          det_coord_x_uncertainties_sources:
            propagate_to_all: "${det_x_uncertainty_source}"
          det_coord_y_source: "${det_y_source}"
          det_coord_y_units_source: "${det_y_units_source}"
          det_coord_y_uncertainties_sources:
            propagate_to_all: "${det_y_uncertainty_source}"
          pixel_pitch_fast_source: "${pixel_fast_source}"
          pixel_pitch_fast_units_source: "${pixel_fast_units_source}"
          pixel_pitch_slow_source: "${pixel_slow_source}"
          pixel_pitch_slow_units_source: "${pixel_slow_units_source}"
          basis_fast: [1.0, 0.0, 0.0]
          basis_slow: [0.0, 1.0, 0.0]
          basis_normal: [0.0, 0.0, 1.0]
      scattering_geometry:
        module: XSGeometryFromPixelCoordinates
        short_title: Calculate scattering geometry
        requires_steps: [.pixel_coordinates]
        configuration:
          with_processing_keys: ["${processing_key}"]
          sample_z_source: "${sample_z_source}"
          sample_z_units_source: "${sample_z_units_source}"
          sample_z_uncertainties_sources:
            propagate_to_all: "${sample_z_uncertainty_source}"
          photon_source: "${photon_source}"
          photon_units_source: "${photon_units_source}"
          photon_uncertainties_sources:
            propagate_to_all: "${photon_uncertainty_source}"
          pixel_pitch_fast_source: "${pixel_fast_source}"
          pixel_pitch_fast_units_source: "${pixel_fast_units_source}"
          pixel_pitch_slow_source: "${pixel_slow_source}"
          pixel_pitch_slow_units_source: "${pixel_slow_units_source}"
          detector_normal: [0.0, 0.0, 1.0]
      solid_angle:
        module: SolidAngleCorrection
        short_title: Apply solid-angle correction
        requires_steps: [.scattering_geometry]
        configuration:
          with_processing_keys: ["${processing_key}"]
      thickness:
        module: Divide
        short_title: Normalize by sample thickness
        requires_steps: [.solid_angle]
        configuration:
          divisor_source: "${thickness_source}"
          divisor_uncertainties_sources:
            propagate_to_all: "${thickness_uncertainty_source}"
          divisor_units_source: "${thickness_units_source}"
          with_processing_keys: ["${processing_key}"]

  radial_average:
    for_each:
      sample:
        processing_key: sample
        start_steps: [apply_absolute_scale]
      intensity_calibration:
        processing_key: intensity_calibration
        start_steps: [geometry.intensity_calibration.thickness]
    steps:
      positive_half_plane:
        module: ThresholdMask
        short_title: Select positive SAXSess azimuthal half-plane
        requires_steps: "${start_steps}"
        configuration:
          with_processing_keys: ["${processing_key}"]
          source_basedata_key: Psi
          target_mask_key: psi_range_mask
          lower_bound: 0.0
          upper_bound: 3.141592653589793
          mask_mode: outside
      q_bins:
        module: IndexByCoordinate
        short_title: Build logarithmic Q bins
        requires_steps: "${start_steps}"
        configuration:
          coordinate_key: Q
          bin_min: 0.1
          bin_max: 6.0
          bin_units: nm^-1
          spacing: log
          n_bins: 100
          with_processing_keys: ["${processing_key}"]
      average:
        module: IndexedAverager
        short_title: Average detector strips by Q
        requires_steps: [.positive_half_plane, .q_bins]
        configuration:
          value_key: signal
          index_key: bin_index
          axis_key: Q
          mask_key: psi_range_mask
          use_value_weights: true
          use_value_uncertainty_weights: false
          uncertainty_weight_key: null
          with_processing_keys: ["${processing_key}"]

steps:
  load_reference_intensity:
    module: AppendProcessingData
    short_title: Load absolute water-reference intensity
    requires_steps: []
    configuration:
      processing_key: intensity_calibration_reference
      rank_of_data: 1
      databundle_output_key: signal
      signal_location: i_cal_reference::I
      units_override: 1/(m sr)
      uncertainties_sources:
        apply_to_all: i_cal_reference::I_sigma

  load_reference_q:
    module: AppendProcessingData
    short_title: Load water-reference Q
    requires_steps: [load_reference_intensity]
    configuration:
      processing_key: intensity_calibration_reference
      rank_of_data: 1
      databundle_output_key: Q
      signal_location: i_cal_reference::Q
      units_override: 1/nm
      uncertainties_sources: {}

  subtract_sample_background:
    module: SubtractDatabundles
    short_title: Subtract water background from N008
    requires_steps:
      - normalize_measurements.sample.frame_average
      - normalize_measurements.sample_background.frame_average
    configuration:
      with_processing_keys: [sample, sample_background]

  subtract_calibrant_background:
    module: SubtractDatabundles
    short_title: Subtract empty capillary from water calibrant
    requires_steps:
      - normalize_measurements.intensity_calibration.frame_average
      - normalize_measurements.intensity_calibration_background.frame_average
    configuration:
      with_processing_keys:
        - intensity_calibration
        - intensity_calibration_background

  find_absolute_scale:
    module: FindScaleFactor1D
    short_title: Fit water-reference scale factor
    requires_steps: [radial_average.intensity_calibration.average, load_reference_q]
    configuration:
      with_processing_keys:
        - intensity_calibration
        - intensity_calibration_reference
      signal_key: signal
      independent_axis_key: Q
      scale_output_key: intensity_scale_factor
      background_output_key: intensity_scale_background
      fit_background: false
      fit_min_val: 2
      fit_max_val: 4
      fit_val_units: nm^-1
      require_overlap: true
      interpolation_kind: linear
      robust_loss: huber
      robust_fscale: 1.0
      use_basedata_weights: true

  apply_absolute_scale:
    module: MultiplyDatabundles
    short_title: Apply water-reference scale factor
    requires_steps: [geometry.sample.thickness, find_absolute_scale]
    configuration:
      with_processing_keys: [sample, intensity_calibration]
      multiplier_data_key: intensity_scale_factor

  combine_geometry_uncertainties:
    module: CombineUncertainties
    short_title: Combine solid-angle uncertainties
    requires_steps: [radial_average.sample.average]
    configuration:
      with_processing_keys: [sample]
      target_basedata_key: signal
      combinations:
        uncertainty_solidangle: [pixel_index_slow, pixel_index_fast]
      drop_source_keys: false
      ignore_missing: false

  select_intensity_uncertainty:
    module: CombineUncertaintiesMax
    short_title: Select larger Poisson or observed frame uncertainty
    requires_steps: [radial_average.sample.average]
    configuration:
      with_processing_keys: [sample]
      target_basedata_key: signal
      combinations:
        uncertainty_intensity: [poisson, STD]
      drop_source_keys: false
      ignore_missing: true

  combine_total_intensity_uncertainty:
    module: CombineUncertainties
    short_title: Combine geometry and intensity uncertainties
    requires_steps: [combine_geometry_uncertainties, select_intensity_uncertainty]
    configuration:
      with_processing_keys: [sample]
      target_basedata_key: signal
      combinations:
        uncertainty_total: [uncertainty_solidangle, uncertainty_intensity]
      drop_source_keys: false
      ignore_missing: true

  combine_q_pixel_uncertainties:
    module: CombineUncertainties
    short_title: Combine Q pixel uncertainties
    requires_steps: [radial_average.sample.average]
    configuration:
      with_processing_keys: [sample]
      target_basedata_key: Q
      combinations:
        uncertainty_combined: [pixel_index_slow, pixel_index_fast]
      drop_source_keys: false
      ignore_missing: false

  combine_total_q_uncertainty:
    module: CombineUncertainties
    short_title: Combine Q pixel and bin-spread uncertainties
    requires_steps: [combine_q_pixel_uncertainties]
    configuration:
      with_processing_keys: [sample]
      target_basedata_key: Q
      combinations:
        uncertainty_combined: [uncertainty_combined, STD]
      drop_source_keys: false
      ignore_missing: false

  export_csv:
    module: SinkProcessingData
    short_title: Export absolute curve to CSV
    requires_steps: [combine_total_intensity_uncertainty, combine_total_q_uncertainty]
    configuration:
      target: "export_csv::"
      data_paths:
        - /sample/Q/signal
        - /sample/Q/uncertainties/uncertainty_combined
        - /sample/signal/signal
        - /sample/signal/uncertainties/uncertainty_total
